name: Audit report
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Full audit
        run: npm audit || true
      - name: Runtime only
        run: npm audit --omit=dev || true
