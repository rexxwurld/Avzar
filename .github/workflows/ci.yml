name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Check Six Labors license is available
        run: |
          if [ -z "$SIXLABORS_LICENSE_KEY" ]; then
            echo "::error title=Missing secret::SIXLABORS_LICENSE_KEY is empty. Add it under Settings > Secrets and variables > Actions (full contents of sixlabors.lic). Secrets are not available to pull requests from forks. See docs/RUNBOOK.md section 8."
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      # The repo has no .sln yet; create it here if it isn't committed.
      - name: Ensure solution
        run: |
          [ -f Tailoring.sln ] || dotnet new sln -n Tailoring --format sln
          dotnet sln Tailoring.sln add src/*/*.csproj tests/*/*.csproj

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory ../test-results

      # Fails when the EF model has changes that no committed migration contains (this is what
      # Migration check #2 found). On failure it also writes the missing migration to an artifact
      # so the difference can be read without running anything locally.
      - name: Check committed migrations match the EF model
        run: |
          dotnet tool install -g dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          if dotnet ef migrations has-pending-model-changes \
              --project src/Tailoring.Infrastructure \
              --startup-project src/Tailoring.Api; then
            echo "Committed migrations match the model."
          else
            echo "::error title=Stale migrations::The model has changes no committed migration contains. Run the 'Generate initial migration' workflow (forward migration), or add one locally. The missing migration is in the 'pending-migration' artifact."
            dotnet ef migrations add CiPending \
              --project src/Tailoring.Infrastructure \
              --startup-project src/Tailoring.Api \
              --output-dir /tmp/ci-migration || true
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-results
          path: test-results

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: pending-migration
          path: /tmp/ci-migration
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # Reports known vulnerabilities in runtime dependencies. Non-blocking until the first clean run, then remove continue-on-error.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Applies the COMMITTED migrations to a clean PostgreSQL and inspects the real schema.
  # The backend tests use EnsureCreated, so this is the only job that proves the migration SQL runs.
  migrations:
    runs-on: ubuntu-24.04
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=avzar_ci;Username=postgres;Password=ci_only_password
      PGPASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: avzar_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Check Six Labors license is available
        run: |
          [ -n "$SIXLABORS_LICENSE_KEY" ] || { echo "::error::SIXLABORS_LICENSE_KEY is empty"; exit 1; }

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - name: Ensure solution
        run: |
          [ -f Tailoring.sln ] || dotnet new sln -n Tailoring --format sln
          dotnet sln Tailoring.sln add src/*/*.csproj tests/*/*.csproj

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Install dotnet-ef
        run: dotnet tool install -g dotnet-ef

      - name: Require committed migrations
        run: |
          [ -d src/Tailoring.Infrastructure/Persistence/Migrations ] || { echo "::error::No committed migrations. Run the 'Generate initial migration' workflow first."; exit 1; }

      - name: Apply migrations to clean PostgreSQL
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project src/Tailoring.Infrastructure --startup-project src/Tailoring.Api

      - name: Inspect the real schema
        run: |
          q() { psql -h localhost -U postgres -d avzar_ci -tA -c "$1"; }
          tables=$(q "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          checks=$(q "select count(*) from pg_constraint where contype='c'")
          fks=$(q "select count(*) from pg_constraint where contype='f'")
          partial=$(q "select count(*) from pg_indexes where schemaname='public' and indexdef like '%WHERE%'")
          echo "tables=$tables check_constraints=$checks foreign_keys=$fks partial_indexes=$partial"
          # The generated migration had 64 tables and 6 filtered indexes; fail if far off.
          [ "$tables" -ge 60 ] || { echo "::error::Too few tables"; exit 1; }
          [ "$partial" -ge 6 ] || { echo "::error::Too few partial indexes"; exit 1; }
          echo "--- financial/audit FKs that cascade (expect none) ---"
          q "select conrelid::regclass||' -> '||confrelid::regclass from pg_constraint where contype='f' and confdeltype='c' and conrelid::regclass::text in ('\"Payments\"','\"Receipts\"','\"CreditNotes\"','\"Invoices\"','\"Expenses\"','\"AuditLogs\"','\"Orders\"')" | tee cascades.txt
          [ ! -s cascades.txt ] || { echo "::error::Cascade delete on financial/audit table"; exit 1; }
