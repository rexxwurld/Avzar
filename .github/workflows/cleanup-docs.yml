name: Cleanup old docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Remove superseded docs
        run: |
          git rm -f --ignore-unmatch \
            docs/ROADMAP_WORK_LOG_2026-10-16.md \
            docs/ROADMAP_WORK_LOG_2026-10-16_PASS3.md \
            docs/ROADMAP_WORK_LOG_2026-10-16_PASS4.md \
            docs/ROADMAP_WORK_LOG_2026-10-16_PASS5.md \
            docs/ROADMAP_WORK_LOG_2026-10-16_PASS12_QUEUE_TESTS.md \
            docs/PASS12_NEXT_UPDATE.md \
            docs/PASS12_COMPLETION_STATUS.md \
            docs/VERIFICATION_REPORT_2026-10-16.md \
            docs/VERIFICATION_REPORT_2026-10-16_ROADMAP.md \
            docs/VERIFICATION_REPORT_2026-10-17.md \
            docs/STATIC_REVIEW.md \
            docs/REMAINING_ROADMAP_WORK.md \
            docs/MIGRATION_MATRIX.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet && { echo "Nothing to remove."; exit 0; }
          git commit -m "docs: remove superseded status logs"
          git pull --rebase
          git push
