name: Fix Node audit (one-off)

# Run once by hand: Actions > "Fix Node audit (one-off)" > Run workflow.
# Upgrades express-rate-limit to a patched release, regenerates the lockfile
# and commits package.json + package-lock.json back to the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Upgrade express-rate-limit (pinned exactly)
        run: npm install express-rate-limit@8.7.1 --save-exact --no-fund
      - name: Audit must now pass
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Commit updated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Upgrade express-rate-limit to 8.7.1 (npm audit fix)"
          git push
