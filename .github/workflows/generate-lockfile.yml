name: Generate web lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate lockfile
        run: |
          npm install -g npm@latest
          npm --version
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund || { echo "--- npm debug log ---"; tail -n 40 ~/.npm/_logs/*-debug-0.log; exit 1; }

      - name: Show audit (runtime dependencies, informational)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web/package-lock.json
          git diff --cached --quiet && { echo "No lockfile change."; exit 0; }
          git commit -m "Add web package-lock.json"
          git pull --rebase
          git push
