name: Generate initial migration

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: "Name of the forward migration to add when migrations already exist (letters and digits only)"
        default: "AddLastTotpStep"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Ensure solution
        run: |
          [ -f Tailoring.sln ] || dotnet new sln -n Tailoring --format sln
          dotnet sln Tailoring.sln add src/*/*.csproj tests/*/*.csproj

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Create migration
        env:
          MIGRATION_NAME: ${{ inputs.migration_name }}
        run: |
          dotnet tool install -g dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dir=src/Tailoring.Infrastructure/Persistence/Migrations
          if [ -d "$dir" ]; then
            # Forward migration: never rewrites or deletes the committed history.
            [[ "$MIGRATION_NAME" =~ ^[A-Za-z][A-Za-z0-9]{2,60}$ ]] || { echo "::error::migration_name must be letters and digits only"; exit 1; }
            before=$(ls "$dir"/*.cs | sort)
            dotnet ef migrations add "$MIGRATION_NAME" \
              --project src/Tailoring.Infrastructure \
              --startup-project src/Tailoring.Api \
              --output-dir Persistence/Migrations
            new=$(comm -13 <(echo "$before") <(ls "$dir"/*.cs | sort) | grep -v Designer || true)
            echo "--- operations in the new migration ---"
            grep -hE "AddColumn|DropColumn|AlterColumn|CreateTable|DropTable|CreateIndex|DropIndex|AddForeignKey|DropForeignKey|AddCheckConstraint|DropCheckConstraint" $new || echo "(none: the model had no pending changes, so this migration is empty)"
          else
            dotnet ef migrations add InitialSchema \
              --project src/Tailoring.Infrastructure \
              --startup-project src/Tailoring.Api \
              --output-dir Persistence/Migrations
          fi

      - name: Commit migration
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add backend/src/Tailoring.Infrastructure/Persistence/Migrations
          git diff --cached --quiet && exit 0
          git commit -m "Add EF migration"
          git pull --rebase
          git push
