name: Mobile + Node migration foundation

on:
  push:
    paths:
      - 'mobile/avzar-expo/**'
      - 'backend-node/**'
      - '.github/workflows/mobile-node-ci.yml'
  pull_request:
    paths:
      - 'mobile/avzar-expo/**'
      - 'backend-node/**'
      - '.github/workflows/mobile-node-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-mobile:
    name: Expo mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/avzar-expo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install Expo Router peer packages and align versions to the SDK
        run: |
          npx expo install expo-constants expo-linking react-native-safe-area-context react-native-screens expo-font
          npx expo install --fix
      - name: Check Expo package compatibility
        run: npx expo-doctor
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Bundle Android JavaScript
        run: npx expo export --platform android

  node-api:
    name: Node API foundation checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: |
          node --check src/config/env.js
          node --check src/http/proxy.js
          node --check src/http/readiness.js
          node --check src/http/app.js
          node --check src/server.js
      - name: Tests
        run: npm test
