name: Mobile + Node migration foundation

on:
  push:
    paths:
      - 'mobile/avzar-expo/**'
      - 'backend-node/**'
      - '.github/workflows/mobile-node-ci.yml'
  pull_request:
    paths:
      - 'mobile/avzar-expo/**'
      - 'backend-node/**'
      - '.github/workflows/mobile-node-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-mobile:
    name: Expo mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/avzar-expo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo packages to the selected SDK
        run: npx expo install --fix
      - name: Check Expo package compatibility
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android

  node-api:
    name: Node API foundation checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
