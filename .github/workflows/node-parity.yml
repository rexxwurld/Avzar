name: Node parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Reads migration/endpoint-inventory.json and the Node routes. Needs no npm install.
      - name: Endpoint parity report (C# vs Node)
        run: node scripts/parity-report.js

      - name: Show summary
        run: |
          node -e "const r=require('./migration/parity-report.json');console.log(JSON.stringify(r.summary));console.log('--- not yet implemented (first 60) ---');r.rows.filter(x=>x.node!=='implemented').slice(0,60).forEach(x=>console.log(x.node.padEnd(12),x.method.padEnd(7),x.path))"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: parity-report
          path: backend-node/migration/parity-report.json

      # Blocks the merge until every C# endpoint has a real Node implementation.
      # Switch the first line to "if: false" while the migration is still in progress.
      - name: Fail while any endpoint is missing or a placeholder
        if: ${{ vars.PARITY_STRICT == 'true' }}
        run: node scripts/parity-report.js --strict

  node-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
